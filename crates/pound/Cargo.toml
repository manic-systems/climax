[package]
name                 = "pound"
version              = "0.6.1"
description          = "low footprint, derive-first CLI parser"
keywords             = [ "cli", "args", "argparse", "derive", "command-line" ]
categories           = [ "command-line-interface" ]
readme               = "../../README.md"
authors.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
default = [ "std", "help", "derive", "color" ]
std     = [  ]
help    = [ "pound-derive?/help" ]
derive  = [ "dep:pound-derive" ]
unicode = [ "dep:unicode-width" ]
color   = [  ]

[dependencies]
pound-derive  = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }

[[example]]
name              = "grab"
required-features = [ "std", "derive" ]

[[example]]
name              = "vault"
required-features = [ "std", "derive" ]

[[example]]
name              = "introspect"
required-features = [ "std", "derive" ]

[[example]]
name              = "paint"
required-features = [ "std", "derive", "help", "color" ]

[lints]
workspace = true
