[package]
name                 = "pound"
version              = "0.4.2"
description          = "low footprint, derive-first CLI parser"
keywords             = [ "cli", "args", "argparse", "derive", "command-line" ]
categories           = [ "command-line-interface" ]
readme               = "../../README.md"
authors.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
default = [ "std", "help", "derive" ]
std     = [  ]
help    = [ "pound-derive?/help" ]
derive  = [ "dep:pound-derive" ]
unicode = [ "dep:unicode-width" ]

[dependencies]
pound-derive = { version = "0.4.2", path = "../pound-derive", optional = true }
unicode-width = { version = "0.2.2", optional = true, default-features = false }

[[example]]
name              = "grab"
required-features = [ "std", "derive" ]

[[example]]
name              = "vault"
required-features = [ "std", "derive" ]

[[example]]
name              = "introspect"
required-features = [ "std", "derive" ]

[lints]
workspace = true
