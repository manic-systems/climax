[package]
name                   = "screw"
version                = "0.1.0"
authors.workspace      = true
categories             = [ "command-line-interface", "command-line-utilities" ]
description            = "A differential terminal renderer with composable widgets for animated command-line output"
edition.workspace      = true
keywords               = [ "terminal", "cli", "tui", "renderer", "animation" ]
license.workspace      = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true

[dependencies]
rustix               = { workspace = true, features = [ "std", "termios" ] }
unicode-segmentation.workspace = true
unicode-width.workspace        = true

[dev-dependencies]
screw-pty = { path = "../screw-pty" }

[lints]
workspace = true
