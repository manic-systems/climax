[package]
name                 = "screw"
version              = "0.0.1"
authors.workspace    = true
categories           = [ "command-line-interface", "command-line-utilities" ]
description          = "A differential terminal renderer with composable widgets for animated command-line output"
edition.workspace    = true
keywords             = [ "terminal", "cli", "tui", "renderer", "animation" ]
license.workspace    = true
readme               = "README.md"
repository.workspace = true

[dependencies]
rustix                = { version = "1.1", default-features = false, features = [ "std", "termios" ] }
unicode-segmentation  = "1.13"
unicode-width         = "0.2.2"

[lints]
workspace = true
