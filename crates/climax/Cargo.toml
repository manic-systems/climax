[package]
name        = "climax"
version     = "0.0.1"
edition     = "2024"
license     = "EUPL-1.2"
description = "batteries-included CLI crate tying together argument parsing, terminal rendering, and prompts"
repository  = "https://github.com/manic-systems/climax"
readme      = "../../README.md"
keywords    = [ "cli", "terminal", "prompts", "args", "tui" ]
categories  = [ "command-line-interface", "command-line-utilities" ]

[features]
complete    = [ "parse", "dep:caress" ]
default     = [ "complete", "derive", "interactive", "render" ]
derive      = [ "parse", "pound/derive" ]
interactive = [ "dep:bang-core", "dep:bang-terminal", "dep:bang-screw", "render" ]
parse       = [ "dep:pound" ]
pty-overlay = [ "parse", "interactive", "dep:bang-screw-pty" ]
render      = [ "dep:screw" ]

[[example]]
name              = "prompt"
required-features = [ "interactive" ]

[[example]]
name              = "status"
required-features = [ "render" ]

[dependencies]
bang-core = { path = "../bang-core", version = "0.0.1", optional = true }
bang-screw = { path = "../bang-screw", version = "0.0.1", optional = true }
bang-screw-pty = { path = "../bang-screw-pty", version = "0.0.1", optional = true }
bang-terminal = { path = "../bang-terminal", version = "0.0.1", optional = true }
caress = { path = "../caress", version = "0.2.0", optional = true }
pound = { path = "../pound", version = "0.5.0", optional = true, default-features = false, features = [
	"std",
	"help",
	"unicode",
] }
screw = { path = "../screw", version = "0.0.1", optional = true }

[lints.clippy]
cargo       = { level = "warn", priority = -1 }
nursery     = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }

arbitrary_source_item_ordering     = "allow"
arithmetic_side_effects            = "allow"
blanket_clippy_restriction_lints   = "allow"
default_numeric_fallback           = "allow"
doc_paragraphs_missing_punctuation = "allow"
else_if_without_else               = "allow"
error_impl_error                   = "allow"
exhaustive_enums                   = "allow"
exhaustive_structs                 = "allow"
impl_trait_in_params               = "allow"
implicit_return                    = "allow"
indexing_slicing                   = "allow"
inline_modules                     = "allow"
inline_trait_bounds                = "allow"
integer_division                   = "allow"
integer_division_remainder_used    = "allow"
missing_docs_in_private_items      = "allow"
missing_inline_in_public_items     = "allow"
missing_trait_methods              = "allow"
mod_module_files                   = "allow"
module_name_repetitions            = "allow"
must_use_candidate                 = "allow"
pattern_type_mismatch              = "allow"
pub_use                            = "allow"
pub_with_shorthand                 = "allow"
question_mark_used                 = "allow"
redundant_pub_crate                = "allow"
semicolon_outside_block            = "allow"
separated_literal_suffix           = "allow"
single_call_fn                     = "allow"
single_char_lifetime_names         = "allow"
string_slice                       = "allow"
tests_outside_test_module          = "allow"
