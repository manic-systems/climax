[package]
name        = "climax"
version     = "0.0.1"
edition     = "2024"
license     = "EUPL-1.2"
description = "batteries-included CLI crate tying together argument parsing, terminal rendering, and prompts"
repository  = "https://github.com/manic-systems/climax"
readme      = "../../README.md"
keywords    = [ "cli", "terminal", "prompts", "args", "tui" ]
categories  = [ "command-line-interface", "command-line-utilities" ]

[features]
default     = [ "derive", "interactive", "parse", "render", "structured" ]
derive      = [ "parse", "pound/derive" ]
interactive = [ "dep:bang-core", "dep:bang", "render" ]
parse       = [ "dep:pound" ]
render      = [ "dep:screw" ]
structured  = [ "dep:serde", "dep:serde_json" ]

[[example]]
name              = "prompt"
required-features = [ "interactive", "structured" ]

[[example]]
name              = "status"
required-features = [ "render" ]

[dependencies]
bang-core = { path = "../bang-core", version = "0.0.1", optional = true }
bang = { path = "../bang", version = "=0.0.1", optional = true }
pound = { path = "../pound", version = "0.2.0", optional = true, default-features = false, features = [
	"std",
	"help",
] }
screw = { path = "../screw", version = "0.0.1", optional = true }
serde = { version = "1", optional = true, features = [ "derive" ] }
serde_json = { version = "1", optional = true }

[lints.clippy]
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

arbitrary_source_item_ordering = "allow"
else_if_without_else           = "allow"
exhaustive_enums               = "allow"
exhaustive_structs             = "allow"
implicit_return                = "allow"
min_ident_chars                = "allow"
missing_docs_in_private_items  = "allow"
missing_errors_doc             = "allow"
missing_inline_in_public_items = "allow"
mod_module_files               = "allow"
module_name_repetitions        = "allow"
must_use_candidate             = "allow"
option_if_let_else             = "allow"
question_mark_used             = "allow"
redundant_pub_crate            = "allow"
single_call_fn                 = "allow"
single_char_lifetime_names     = "allow"
