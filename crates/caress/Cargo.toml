[package]
name                 = "caress"
version              = "0.3.0"
description          = "shell completions and man pages for pound commands"
keywords             = [ "cli", "completion", "manpage", "mdoc", "pound" ]
categories           = [ "command-line-interface" ]
readme               = "../../README.md"
authors.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
pound = { workspace = true, features = [ "std" ] }

[dev-dependencies]
pound = { workspace = true, default-features = true }

[[example]]
name = "keyring"

[lints]
workspace = true
