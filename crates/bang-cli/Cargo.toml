[package]
name                 = "bang"
version              = "0.0.1"
authors.workspace    = true
categories           = [ "command-line-interface" ]
description          = "cli for bang widgets"
edition.workspace    = true
keywords             = [ "cli", "input", "terminal", "widgets" ]
license.workspace    = true
readme               = "../../README.md"
repository.workspace = true

[dependencies]
bang-core.workspace     = true
bang-screw.workspace    = true
bang-terminal.workspace = true
pound                   = { workspace = true, default-features = true }
serde.workspace         = true
toml.workspace          = true

[dev-dependencies]
libc.workspace = true

[[bin]]
name = "bang"
path = "src/main.rs"

[lints]
workspace = true
