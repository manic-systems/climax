[package]
name                 = "bang-run"
version              = "0.0.1"
authors.workspace    = true
categories           = [ "command-line-interface" ]
description          = "Command-line tool that runs bang prompts and prints their answers"
edition.workspace    = true
exclude              = [ "tests/lockfile.rs" ]
keywords             = [ "cli", "input", "terminal", "widgets" ]
license.workspace    = true
readme               = "README.md"
repository.workspace = true

[dependencies]
bang      = { path = "../bang", version = "=0.0.1" }
bang-core = { path = "../bang-core", version = "=0.0.1" }
pound     = { workspace = true, features = [ "std", "help", "derive" ] }
serde     = { workspace = true }
toml      = { workspace = true }

[dev-dependencies]
libc = "0.2"

[[bin]]
name = "bang"
path = "src/main.rs"
doc  = false

[lints]
workspace = true
