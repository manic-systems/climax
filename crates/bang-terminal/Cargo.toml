[package]
name                 = "bang-terminal"
version              = "0.0.1"
authors.workspace    = true
categories           = [ "command-line-interface" ]
description          = "Terminal input decoding, raw mode and event loop behind the bang prompts"
edition.workspace    = true
keywords             = [ "cli", "input", "terminal", "ansi" ]
license.workspace    = true
readme               = "../../README.md"
repository.workspace = true

[dependencies]
bang-core = { path = "../bang-core", version = "=0.0.1" }
libc = "0.2"
rustix = { version = "1.1", default-features = false, features = [ "event", "fs", "pipe", "process", "std", "termios" ] }

[lints]
workspace = true
