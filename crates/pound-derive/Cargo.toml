[package]
name                 = "pound-derive"
version              = "0.2.0"
description          = "derive macros for pound"
keywords             = [ "cli", "args", "derive" ]
categories           = [ "command-line-interface" ]
readme               = "../../README.md"
authors.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
# forwarded from pound's `help` feature, see pound/Cargo.toml
help = [  ]

[lib]
proc-macro = true

[dependencies]
pound-derive-impl = { version = "=0.2.0", path = "../pound-derive-impl" }

[dev-dependencies]
pound = { path = "../pound" }

[lints]
workspace = true
