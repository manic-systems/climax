name: Tag and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  prepare-pound:
    name: Prepare pound
    permissions:
      contents: write
      id-token: write
    needs: ci
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      stage: prepare
      tag-prefix: pound-v
      # pound pins its derive crates with `=`, so the three only ship together
      version-command: >-
        for crate in pound pound-derive pound-derive-impl; do
        nix run nixpkgs#fq -- -r .package.version "crates/$crate/Cargo.toml";
        done | sort -u | { read -r version; ! read -r _ && echo "$version"; }

  publish-pound:
    name: Publish pound
    permissions:
      contents: write
      id-token: write
    needs: prepare-pound
    if: ${{ needs.prepare-pound.result == 'success' && needs.prepare-pound.outputs.skip != 'true' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      stage: publish
      version: ${{ needs.prepare-pound.outputs.version }}
      install-nix: false
      publish-command: cargo publish --locked -p pound-derive-impl -p pound-derive -p pound

  prepare-caress:
    name: Prepare caress
    permissions:
      contents: write
      id-token: write
    needs: ci
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      stage: prepare
      tag-prefix: caress-v
      version-command: nix run nixpkgs#fq -- -r .package.version crates/caress/Cargo.toml

  publish-caress:
    name: Publish caress
    permissions:
      contents: write
      id-token: write
    # caress may need the pound release from this same push
    needs: [prepare-caress, publish-pound]
    if: >-
      ${{ !cancelled()
      && needs.prepare-caress.result == 'success'
      && needs.prepare-caress.outputs.skip != 'true'
      && needs.publish-pound.result != 'failure' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      stage: publish
      version: ${{ needs.prepare-caress.outputs.version }}
      install-nix: false
      publish-command: cargo publish --locked -p caress
