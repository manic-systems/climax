name: Pins Update

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    uses: manic-systems/workflows/.github/workflows/pins-update.yml@23a06db817dba5ff9dee828279eb3070f405d9e1 # v2.3.1
    with:
      client-id: ${{ vars.MANIC_BOT_CLIENT_ID }}
    secrets:
      private-key: ${{ secrets.MANIC_BOT_PRIVATE_KEY }}
