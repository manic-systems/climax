[workspace]
members = [
  "crates/bang-cli",
  "crates/bang-core",
  "crates/bang-screw",
  "crates/bang-screw-pty",
  "crates/bang-terminal",
  "crates/caress",
  "crates/climax",
  "crates/pound",
  "crates/pound-derive",
  "crates/pound-derive-impl",
  "crates/screw",
  "crates/screw-pty",
]
resolver = "3"

[workspace.package]
authors    = [ "atagen" ]
edition    = "2024"
license    = "EUPL-1.2"
repository = "https://github.com/manic-systems/climax"

[workspace.dependencies]
bang              = { path = "crates/bang-cli", version = "0.0.1" }
bang-core         = { path = "crates/bang-core", version = "0.0.1" }
bang-screw        = { path = "crates/bang-screw", version = "0.0.1" }
bang-screw-pty    = { path = "crates/bang-screw-pty", version = "0.0.1" }
bang-terminal     = { path = "crates/bang-terminal", version = "0.0.1" }
caress            = { path = "crates/caress", version = "0.3.0" }
climax            = { path = "crates/climax", version = "0.0.1" }
pound             = { path = "crates/pound", version = "0.6.0", default-features = false }
pound-derive      = { path = "crates/pound-derive", version = "=0.6.0" }
pound-derive-impl = { path = "crates/pound-derive-impl", version = "=0.6.0" }
screw             = { path = "crates/screw", version = "0.0.1" }
screw-pty         = { path = "crates/screw-pty", version = "0.0.1" }

libc          = "0.2.191"
proc-macro2   = "1.0.107"
quote         = "1.0.47"
serde         = { version = "1.0.229", features = [ "derive" ] }
toml          = "1.1.8"
unicode-width = { version = "0.2.2", default-features = false }
venial        = "0.6.1"

[workspace.lints.clippy]
cargo       = { level = "warn", priority = -1 }
nursery     = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }

arbitrary_source_item_ordering     = "allow"
arithmetic_side_effects            = "allow"
blanket_clippy_restriction_lints   = "allow"
default_numeric_fallback           = "allow"
doc_paragraphs_missing_punctuation = "allow"
else_if_without_else               = "allow"
error_impl_error                   = "allow"
exhaustive_enums                   = "allow"
exhaustive_structs                 = "allow"
impl_trait_in_params               = "allow"
implicit_return                    = "allow"
indexing_slicing                   = "allow"
inline_modules                     = "allow"
inline_trait_bounds                = "allow"
integer_division                   = "allow"
integer_division_remainder_used    = "allow"
missing_docs_in_private_items      = "allow"
missing_inline_in_public_items     = "allow"
missing_trait_methods              = "allow"
mod_module_files                   = "allow"
module_name_repetitions            = "allow"
must_use_candidate                 = "allow"
pattern_type_mismatch              = "allow"
pub_use                            = "allow"
pub_with_shorthand                 = "allow"
question_mark_used                 = "allow"
redundant_pub_crate                = "allow"
semicolon_outside_block            = "allow"
separated_literal_suffix           = "allow"
single_call_fn                     = "allow"
single_char_lifetime_names         = "allow"
string_slice                       = "allow"
tests_outside_test_module          = "allow"

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = "s"
panic         = "abort"
strip         = true
