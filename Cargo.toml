[workspace]
members = [
	"crates/bang",
	"crates/bang-core",
	"crates/bang-run",
	"crates/bang-terminal",
	"crates/climax",
	"crates/climax-derive",
	"crates/pound",
	"crates/pound-derive",
	"crates/pound-derive-impl",
	"crates/screw",
	"crates/screw-pty",
	"tests/compile-fixtures/bang-only",
	"tests/compile-fixtures/climax-derive-only",
	"tests/compile-fixtures/climax-interactive-only",
	"tests/compile-fixtures/climax-no-default-features",
	"tests/compile-fixtures/climax-only",
	"tests/compile-fixtures/climax-parse-only",
	"tests/compile-fixtures/climax-render-only",
	"tests/compile-fixtures/climax-structured-only",
	"tests/compile-fixtures/climax-with-components",
	"tests/compile-fixtures/pound-no-derive",
	"tests/compile-fixtures/pound-no-help",
	"tests/compile-fixtures/pound-no-std",
	"tests/compile-fixtures/pound-only",
	"tests/compile-fixtures/screw-only",
]
default-members = [
	"crates/bang",
	"crates/bang-core",
	"crates/bang-run",
	"crates/bang-terminal",
	"crates/climax",
	"crates/climax-derive",
	"crates/pound",
	"crates/pound-derive",
	"crates/pound-derive-impl",
	"crates/screw",
	"crates/screw-pty",
]
resolver = "3"

[workspace.package]
authors    = [ "atagen" ]
edition    = "2024"
license    = "EUPL-1.2"
repository = "https://github.com/manic-systems/climax"

[workspace.dependencies]
bang              = { path = "crates/bang", version = "=0.0.1" }
bang-core         = { path = "crates/bang-core", version = "=0.0.1" }
bang-terminal     = { path = "crates/bang-terminal", version = "=0.0.1" }
climax            = { path = "crates/climax", version = "=0.0.1" }
climax-derive     = { path = "crates/climax-derive", version = "=0.0.1" }
libc              = "0.2"
pound             = { path = "crates/pound", version = "=0.2.1", default-features = false }
pound-derive      = { path = "crates/pound-derive", version = "=0.2.1" }
pound-derive-impl = { path = "crates/pound-derive-impl", version = "=0.2.1" }
rustix            = { version = "1.1", default-features = false }
screw             = { path = "crates/screw", version = "=0.0.1" }
serde             = "1"
serde_json        = "1"
toml              = "0.8"
unicode-segmentation = "1.13"
unicode-width        = "0.2.2"

[workspace.lints.clippy]
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

arbitrary_source_item_ordering = "allow"
else_if_without_else           = "allow"
exhaustive_enums               = "allow"
exhaustive_structs             = "allow"
implicit_return                = "allow"
min_ident_chars                = "allow"
missing_docs_in_private_items  = "allow"
missing_errors_doc             = "allow"
missing_inline_in_public_items = "allow"
mod_module_files               = "allow"
module_name_repetitions        = "allow"
must_use_candidate             = "allow"
option_if_let_else             = "allow"
question_mark_used             = "allow"
redundant_pub_crate            = "allow"
single_call_fn                 = "allow"
single_char_lifetime_names     = "allow"

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = "s"
panic         = "unwind"
strip         = true
